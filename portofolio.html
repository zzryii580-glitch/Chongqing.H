<!DOCTYPE html>

    <title>Portofolio - Chongqing Design</title>
    <link rel="stylesheet" href="gaya.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

</head>
<body>

    <div class="scanlines"></div>
    <div class="hologram-grid"></div>

    <header class="cyber-header">
        <div class="logo-container">
            <img src="assets/logo.png" alt="Logo" class="logo-img">
            <span class="logo-text">CHONGQING<span class="highlight">.DESIGN</span></span>
        </div>
        <nav class="cyber-nav">
            <a href="indeks.html" class="nav-btn click-fx">Beranda</a>
            <a href="portofolio.html" class="nav-btn click-fx active">Portofolio</a>
            <a href="tentang.html" class="nav-btn click-fx">Tentang</a>
            <a href="contact.html" class="nav-btn click-fx">Kontak</a>

    <main class="main-container">
        <section class="page active-page">
            <h2 class="section-title"><span>01 //</span> Portofolio Desain</h2>
            <p class="section-subtitle">Contoh karya visual Anda.</p>
            
            <div class="portfolio-grid">
                <div class="portfolio-card click-fx">
                    <div class="card-img" style="background-image: url('assets/portfolio/design1.jpg');"></div>

                        <p>Konsep antarmuka masa depan.</p>

                </div>
                <div class="portfolio-card click-fx">
                    <div class="card-img" style="background-image: url('assets/portfolio/design2.jpg');"></div>

                    </div>
                </div>
                <div class="portfolio-card click-fx">
                    <div class="card-img" style="background-image: url('assets/portfolio/design3.jpg');"></div>
                    <div class="card-info">
                        <h3>Mecha Branding</h3>
                        <p>Identitas merek robotik.</p>
